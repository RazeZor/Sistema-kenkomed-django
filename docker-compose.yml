version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: my_database
      MYSQL_USER: django_user
      MYSQL_PASSWORD: my_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "django_user", "-pmy_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
      while ! python -c 'import socket; s=socket.socket(); s.connect((\"db\", 3306))' 2>/dev/null; do
        echo 'Esperando que la base de datos este lista...';
        sleep 3;
      done;
      python manage.py collectstatic --noinput &&
      uvicorn ProyectoMainAPP.asgi:application --host 0.0.0.0 --port 8000 --workers 4"
    expose:
      - "8000"
    environment:
      DJANGO_SETTINGS_MODULE: ProyectoMainAPP.settings
      DB_HOST: db
      DB_NAME: my_database
      DB_USER: django_user
      DB_PASSWORD: my_password
      DB_PORT: "3306"
      EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
      EMAIL_HOST: "smtp.gmail.com"
      EMAIL_PORT: "587"
      EMAIL_USE_TLS: "True"
      EMAIL_HOST_USER: "kenkomedplus@gmail.com"
      EMAIL_HOST_PASSWORD: "irykslbyckmeiewn"
      DEFAULT_FROM_EMAIL: "kenkomedplus@gmail.com"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web

volumes:
  db_data:
  static_volume:
  media_volume: