{% if paciente %}
<div class="bg-gradient-to-r from-medical-blue/5 to-medical-blue/10 border border-medical-blue/20 rounded-xl p-4">
    <div class="flex items-center justify-between flex-wrap gap-3">
        <div class="flex items-center space-x-3">
            <div class="bg-white p-2 rounded-full shadow-sm">
                <i class='bx bx-user text-medical-blue text-xl'></i>
            </div>
            <div>
                <h3 class="font-semibold text-gray-800">Paciente Seleccionado</h3>
                <p class="text-gray-600">{{ paciente.nombre }} {{ paciente.apellido }} ({{ paciente.rut }})</p>
            </div>
        </div>
        <div class="text-right text-sm text-gray-600">
            {% if paciente.fechaNacimiento %}
            <div>Fecha de Nacimiento</div>
            <div class="font-medium">{{ paciente.fechaNacimiento|date:"d/m/Y" }}</div>
            {% else %}
            <div class="font-medium">{{ paciente.genero|default:"Sin datos demográficos" }}</div>
            {% endif %}
        </div>
    </div>
</div>
{% endif %}
