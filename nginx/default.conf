server {
    listen 80;
    server_name localhost;

    # Maximizar el tamaño permitido para subidas (imágenes, documentos, etc.)
    client_max_body_size 50M;

    # Habilitar compresión Gzip para optimizar velocidad de carga
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Archivos estáticos colectados
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Archivos multimedia subidos por los usuarios
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy reverso hacia la app Django/Uvicorn
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Desactivar redirección de puertos
        proxy_redirect off;
    }
}
